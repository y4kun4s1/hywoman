<!DOCTYPE html>
<html>
<head>
    <title>CSS Property Basic</title>
    <style>
        .div2 {
            width: 100px; height: 100px;
            background-color: red;
        }    

        .div1 {
                width: 100px; height: 100px;
                background-color: red;
        
                border: 20px solid black;
                margin: 10px; padding: 30px;
            }

    </style>
</head>
<body>
    <div class="div2"></div>

    <div class="div1"></div>

</body>
</html>
